<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services | Innovexa Technologies</title>
  <link rel="icon" type="image/jpeg" href="assets/head.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .services-back-to-top{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border:0;border-radius:50%;background:linear-gradient(135deg,#8fe8ff 0%,#4ba2ff 42%,#5b6dff 100%);color:#04121c;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -14px rgba(91,109,255,.8),inset 0 1px 0 rgba(255,255,255,.48),inset 0 -4px 12px rgba(22,80,170,.4);opacity:0;pointer-events:none;cursor:pointer;transform:translateY(18px) scale(.92) perspective(600px) rotateX(22deg);transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease;z-index:100}
    .services-back-to-top.is-visible{opacity:1;pointer-events:auto;transform:translateY(0) scale(1) perspective(600px) rotateX(0)}
    .services-back-to-top:hover{transform:translateY(-4px) scale(1.04) perspective(600px) rotateX(8deg);box-shadow:0 18px 34px -12px rgba(91,109,255,.95),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -4px 14px rgba(34,76,184,.42)}
    .services-back-to-top svg{width:20px;height:20px}
    @media (max-width:600px){.services-back-to-top{right:16px;bottom:16px;width:46px;height:46px}}
    @media (prefers-reduced-motion:reduce){.services-back-to-top{transition:none}.services-back-to-top:hover{transform:none}}
  </style>
</head>
<body>
  <div id="services-header" aria-live="polite"></div>

  <main id="services-content"></main>

  <div id="services-footer" aria-live="polite"></div>

  <button type="button" id="servicesBackToTop" class="services-back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    (function () {
      'use strict';

      var backToTop = document.getElementById('servicesBackToTop');
      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function updateBackToTop() {
        backToTop.classList.toggle('is-visible', window.scrollY > 500);
      }

      window.addEventListener('scroll', updateBackToTop, { passive: true });
      updateBackToTop();

      backToTop.addEventListener('click', function () {
        window.scrollTo({
          top: 0,
          behavior: prefersReducedMotion ? 'auto' : 'smooth'
        });
      });

      var profiles = {
        Facebook: 'https://www.facebook.com/share/p/19RpGrEWoA/',
        Instagram: 'https://www.instagram.com/innovexatechnologies_01?igsi=MWFoNDU5NzIyZDdqdg==',
        LinkedIn: 'https://www.linkedin.com/company/innovexa-digital/',
        X: 'https://x.com/innovexatech_01',
        TikTok: 'https://www.tiktok.com/@innovexa.technologies01',
        WhatsApp: 'https://wa.me/923247943761',
        GitHub: 'https://github.com/innovexatechnologies'
      };

      function loadScript(script) {
        return new Promise(function (resolve, reject) {
          var replacement = document.createElement('script');
          Array.prototype.forEach.call(script.attributes, function (attribute) {
            replacement.setAttribute(attribute.name, attribute.value);
          });
          replacement.textContent = script.textContent;
          if (script.src) {
            replacement.onload = resolve;
            replacement.onerror = reject;
          } else {
            resolve();
          }
          document.body.appendChild(replacement);
        });
      }

      function readSharedShell() {
        return fetch('index.html')
          .then(function (response) {
            if (!response.ok) throw new Error('Unable to load the shared site shell.');
            return response.text();
          })
          .then(function (source) {
            var parsed = new DOMParser().parseFromString(source, 'text/html');
            var masterStyle = parsed.querySelector('head > style');
            var header = parsed.querySelector('body > header');
            var footer = parsed.querySelector('body > footer');
            if (!header || !footer) throw new Error('The shared header or footer is missing.');

            if (masterStyle) {
              var style = document.createElement('style');
              style.textContent = masterStyle.textContent;
              document.head.appendChild(style);
            }

            document.getElementById('services-header').appendChild(header.cloneNode(true));

            return footer;
          });
      }

      function importFooter(footer) {
        document.getElementById('services-footer').appendChild(footer.cloneNode(true));

        document.querySelectorAll('#services-footer .footer-social a').forEach(function (link) {
          var label = link.getAttribute('aria-label');
          if (label === 'Twitter / X') label = 'X';
          if (label === 'YouTube') label = 'GitHub';
          if (['Facebook', 'Instagram', 'LinkedIn', 'X', 'TikTok'].indexOf(label) !== -1) {
            link.target = '_blank';
            link.rel = 'noopener';
          }
          if (profiles[label]) {
            link.href = profiles[label];
            link.setAttribute('aria-label', label);
            link.title = label;
          }
        });

        var year = document.querySelector('#services-footer #year');
        if (year) year.textContent = new Date().getFullYear();
      }

      function importContent() {
        return fetch('servicepage.html')
        .then(function (response) {
          if (!response.ok) throw new Error('Unable to load the services page.');
          return response.text();
        })
        .then(function (source) {
          var parsed = new DOMParser().parseFromString(source, 'text/html');
          parsed.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (node) {
            document.head.appendChild(node.cloneNode(true));
          });

          var content = document.getElementById('services-content');
          Array.prototype.slice.call(parsed.body.children).forEach(function (node) {
            if (node.tagName.toLowerCase() !== 'script') content.appendChild(node.cloneNode(true));
          });

          return Array.prototype.slice.call(parsed.querySelectorAll('body > script'))
            .reduce(function (promise, script) {
              return promise.then(function () { return loadScript(script); });
            }, Promise.resolve());
        })
        .then(function () {
          document.dispatchEvent(new Event('DOMContentLoaded'));
        });
      }

      readSharedShell()
        .then(function (footer) {
          return importContent().then(function () {
            importFooter(footer);
          });
        })
        .catch(function (error) {
          console.error(error);
        });
    })();
  </script>
</body>
</html>
